name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Check shell syntax and launcher installation
        run: |
          for script in ./*.sh ./tandem ./tests/*.sh; do
            bash -n "$script"
          done
          bash tests/install-tests.sh
      - name: Build and test
        run: swift test
